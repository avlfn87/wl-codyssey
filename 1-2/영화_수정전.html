<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빈티지 영화 티어 메이커</title>
    <style>
        /* --- 디자인 테마 (CSS) --- */
        :root {
            --bg-color: #1a0a0a; /* 짙은 와인색 배경 */
            --panel-color: #2d1b1b;
            --gold: #d4af37;
            --text-light: #f5e6d3;
            --tier-s: #ff4b2b;
            --tier-a: #ff8c00;
            --tier-b: #ffd700;
            --tier-c: #4caf50;
            --tier-d: #2196f3;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: var(--gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            border-bottom: 2px double var(--gold);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        /* 티어 컨테이너 */
        #tier-container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-color);
            border: 5px solid #3d2b2b;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
            padding: 10px;
        }

        .tier-row {
            display: flex;
            min-height: 160px;
            border-bottom: 1px solid #444;
            background: rgba(0,0,0,0.2);
        }

        .tier-row:last-child { border-bottom: none; }

        .tier-label {
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #000;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.3);
            flex-shrink: 0;
        }

        /* 티어별 색상 */
        .s { background-color: var(--tier-s); }
        .a { background-color: var(--tier-a); }
        .b { background-color: var(--tier-b); }
        .c { background-color: var(--tier-c); }
        .d { background-color: var(--tier-d); }

        .tier-content {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            gap: 10px;
            min-width: 100px;
        }

        /* 영화 카드 스타일 */
        .movie-card {
            width: 100px;
            height: 150px;
            background-color: #333;
            border: 2px solid var(--gold);
            cursor: grab;
            overflow: hidden;
            position: relative;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .movie-card:active { cursor: grabbing; }
        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 대기열(Pool) */
        #pool {
            width: 100%;
            max-width: 800px;
            margin-top: 30px;
            padding: 20px;
            background: #222;
            border: 2px dashed var(--gold);
            min-height: 180px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        /* 컨트롤 버튼 */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: var(--gold);
            border: none;
            color: #1a0a0a;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }

        button:hover { background-color: #f5d161; }

        #file-input { display: none; }
    </style>
</head>
<body>

    <h1>🎬 VINTAGE MOVIE TIER LIST</h1>

    <!-- 티어리스트 영역 (저장될 영역) -->
    <div id="tier-container">
        <div class="tier-row">
            <div class="tier-label s">S</div>
            <div class="tier-content" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label a">A</div>
            <div class="tier-content" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label b">B</div>
            <div class="tier-content" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label c">C</div>
            <div class="tier-content" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label d">D</div>
            <div class="tier-content" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        </div>
    </div>

    <!-- 이미지 대기열 -->
    <div id="pool" ondrop="drop(event)" ondragover="allowDrop(event)">
        <p id="placeholder-text" style="color: #666; width: 100%; text-align: center;">이미지를 업로드하면 여기에 나타납니다 (최대 10개)</p>
    </div>

    <!-- 컨트롤 버튼 -->
    <div class="controls">
        <input type="file" id="file-input" multiple accept="image/*" onchange="handleUpload(event)">
        <button onclick="document.getElementById('file-input').click()">이미지 불러오기</button>
        <button onclick="saveAsImage()">결과 저장하기</button>
    </div>

    <!-- 이미지 저장을 위한 외부 라이브러리 (CDN) -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <script>
        /* --- 동작 로직 (JavaScript) --- */
        let cardCount = 0;

        // 1. 이미지 업로드 처리
        function handleUpload(event) {
            const files = event.target.files;
            const pool = document.getElementById('pool');
            const placeholder = document.getElementById('placeholder-text');

            if (files.length + cardCount > 12) {
                alert("원활한 관리를 위해 이미지는 10개 내외로 업로드해주세요.");
            }

            if (files.length > 0 && placeholder) {
                placeholder.style.display = 'none';
            }

            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.draggable = true;
                    card.id = 'card-' + Date.now() + Math.random();
                    card.ondragstart = drag;

                    const img = document.createElement('img');
                    img.src = e.target.result;
                    
                    card.appendChild(img);
                    pool.appendChild(card);
                    cardCount++;
                };
                reader.readAsDataURL(file);
            }
        }

        // 2. 드래그 앤 드롭 로직
        function allowDrop(e) {
            e.preventDefault();
        }

        function drag(e) {
            e.dataTransfer.setData("text", e.target.id);
        }

        function drop(e) {
            e.preventDefault();
            const data = e.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);
            
            // drop 타겟이 tier-content인지 확인 (자식 요소인 img 등에 드롭되는 경우 처리)
            let target = e.target;
            while (target && !target.classList.contains('tier-content') && target.id !== 'pool') {
                target = target.parentElement;
            }

            if (target) {
                target.appendChild(draggedElement);
            }
        }

        // 3. 이미지 저장 기능 (html2canvas 사용)
        function saveAsImage() {
            const container = document.getElementById('tier-container');
            
            html2canvas(container).then(canvas => {
                const link = document.createElement('a');
                link.download = 'my-movie-tier-list.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
