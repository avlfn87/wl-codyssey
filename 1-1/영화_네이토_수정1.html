<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>빈티지 영화 티어 메이커</title>
    <style>
        :root {
            --bg-color: #1a0a0a;
            --panel-color: #2d1b1b;
            --gold: #d4af37;
            --text-light: #f5e6d3;
            --tier-s: #ff4b2b;
            --tier-a: #ff8c00;
            --tier-b: #ffd700;
            --tier-c: #4caf50;
            --tier-d: #2196f3;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            user-select: none; /* 텍스트 선택 방지 */
        }

        h1 {
            color: var(--gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            border-bottom: 2px double var(--gold);
            padding-bottom: 10px;
        }

        #tier-container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-color);
            border: 5px solid #3d2b2b;
            padding: 10px;
        }

        .tier-row {
            display: flex;
            min-height: 160px;
            border-bottom: 1px solid #444;
            background: rgba(0,0,0,0.2);
        }

        .tier-label {
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #000;
            flex-shrink: 0;
        }

        .s { background-color: var(--tier-s); }
        .a { background-color: var(--tier-a); }
        .b { background-color: var(--tier-b); }
        .c { background-color: var(--tier-c); }
        .d { background-color: var(--tier-d); }

        .tier-content {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            gap: 10px;
            min-width: 150px; /* 드롭 영역 확보 */
        }

        /* 영화 카드 */
        .movie-card {
            width: 100px;
            height: 150px;
            background-color: #333;
            border: 2px solid var(--gold);
            cursor: grab;
            position: relative;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.5);
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* 중요: 이미지가 드래그 이벤트를 방해하지 않도록 함 */
        }

        #pool {
            width: 100%;
            max-width: 800px;
            margin-top: 30px;
            padding: 20px;
            background: #222;
            border: 2px dashed var(--gold);
            min-height: 180px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            background-color: var(--gold);
            border: none;
            color: #1a0a0a;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }

        #file-input { display: none; }
    </style>
</head>
<body>

    <h1>🎬 VINTAGE MOVIE TIER LIST</h1>

    <div id="tier-container">
        <div class="tier-row">
            <div class="tier-label s">S</div>
            <div class="tier-content" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label a">A</div>
            <div class="tier-content" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label b">B</div>
            <div class="tier-content" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label c">C</div>
            <div class="tier-content" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>
        <div class="tier-row">
            <div class="tier-label d">D</div>
            <div class="tier-content" ondragover="allowDrop(event)" ondrop="drop(event)"></div>
        </div>
    </div>

    <div id="pool" ondragover="allowDrop(event)" ondrop="drop(event)">
        <p id="placeholder-text" style="color: #666; width: 100%; text-align: center;">이미지를 업로드하세요</p>
    </div>

    <div class="controls">
        <input type="file" id="file-input" multiple accept="image/*" onchange="handleUpload(event)">
        <button onclick="document.getElementById('file-input').click()">이미지 불러오기</button>
        <button onclick="saveAsImage()">결과 저장하기</button>
    </div>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <script>
        let cardCount = 0;

        function handleUpload(event) {
            const files = event.target.files;
            const pool = document.getElementById('pool');
            const placeholder = document.getElementById('placeholder-text');

            if (files.length > 0 && placeholder) {
                placeholder.style.display = 'none';
            }

            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.draggable = true;
                    card.id = 'card-' + Date.now() + Math.random();
                    
                    // 드래그 시작 이벤트
                    card.ondragstart = function(ev) {
                        ev.dataTransfer.setData("text", ev.target.id);
                    };

                    const img = document.createElement('img');
                    img.src = e.target.result;
                    
                    card.appendChild(img);
                    pool.appendChild(card);
                };
                reader.readAsDataURL(file);
            }
        }

        function allowDrop(e) {
            e.preventDefault(); // 드롭을 허용하기 위해 필수
        }

        function drop(e) {
            e.preventDefault();
            const data = e.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);
            
            // 드롭된 위치가 tier-content인지 확인 (이미지나 다른 요소 위에 떨어뜨려도 부모를 찾아감)
            let target = e.target;
            while (target && !target.classList.contains('tier-content') && target.id !== 'pool') {
                target = target.parentElement;
            }

            if (target && draggedElement) {
                target.appendChild(draggedElement);
            }
        }

        function saveAsImage() {
            const container = document.getElementById('tier-container');
            html2canvas(container).then(canvas => {
                const link = document.createElement('a');
                link.download = 'movie-tier-list.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
